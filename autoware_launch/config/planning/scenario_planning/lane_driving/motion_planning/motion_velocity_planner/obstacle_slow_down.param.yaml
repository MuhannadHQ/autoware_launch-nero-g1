/**:
  ros__parameters:
    obstacle_slow_down:
      slow_down_planning:
        slow_down_min_acc: -1.0         # slow down min deceleration [m/ss]
        slow_down_min_jerk: -1.0        # slow down min jerk [m/sss]

        lpf_gain_slow_down_vel: 0.9  # low-pass filter gain for slow down velocity
        lpf_gain_lat_dist: 0.9  # low-pass filter gain for lateral distance from obstacle to ego's path
        lpf_gain_dist_to_slow_down: 0.7 # low-pass filter gain for distance to slow down start

        time_margin_on_target_velocity: 1.5 # [s]

        # parameters to calculate slow down velocity by linear interpolation
        object_type_specified_params:
          types:
            - "default"
            - "car"    # [nero 2026-11-15 parkedcars]
            - "truck"  # [nero 2026-11-15 parkedcars]
            - "pedestrian"  # [nero 2026-11-24 sidegap] used only with NERO_OSD_TYPE_PARAMS=1 (without it every type gets "default")
            - "bicycle"     # [nero 2026-11-24 sidegap] used only with NERO_OSD_TYPE_PARAMS=1
          default:
            moving:
              min_lat_margin: 0.2
              max_lat_margin: 0.7
              min_ego_velocity: 0.7
              max_ego_velocity: 2.78
            static:
              min_lat_margin: 0.2
              max_lat_margin: 0.6
              min_ego_velocity: 1.4
              max_ego_velocity: 4.17
          car:  # [nero 2026-11-24 sidegap, LATEAVOID-1123] a standing car: 1.0 m/s (3.6 km/h) at <= 0.4 m, 4.17 m/s (15 km/h, = the default table the car really used) from 0.5 m (0.44 m -> 2.27 m/s = the 24 Nov 20:58 'great' pass); moving = default. Live only with NERO_OSD_TYPE_PARAMS=1. (2026-11-15 parkedcars values 0.2/1.4 -> 0.6/5.56 never applied: type lookup bug, upstream #10672)
            moving:
              min_lat_margin: 0.2
              max_lat_margin: 0.7
              min_ego_velocity: 0.7
              max_ego_velocity: 2.78
            static:
              min_lat_margin: 0.4
              max_lat_margin: 0.5
              min_ego_velocity: 1.0
              max_ego_velocity: 4.17
          truck:  # [nero 2026-11-24 sidegap, LATEAVOID-1123] a standing truck: 1.0 m/s (3.6 km/h) at <= 0.4 m, 4.17 m/s (15 km/h, = the default table the car really used) from 0.5 m (0.44 m -> 2.27 m/s = the 24 Nov 20:58 'great' pass); moving = default. Live only with NERO_OSD_TYPE_PARAMS=1. (2026-11-15 parkedcars values 0.2/1.4 -> 0.6/5.56 never applied: type lookup bug, upstream #10672)
            moving:
              min_lat_margin: 0.2
              max_lat_margin: 0.7
              min_ego_velocity: 0.7
              max_ego_velocity: 2.78
            static:
              min_lat_margin: 0.4
              max_lat_margin: 0.5
              min_ego_velocity: 1.0
              max_ego_velocity: 4.17
          pedestrian:  # [nero 2026-11-24 sidegap, PEDPASS-1122] a person within 0.5 m of the robot's band: 0.6 m/s (2.2 km/h); 2.78 m/s (moving) / 4.17 (standing) from 1.0 m. Read with NERO_OSD_PERSON.
            moving:
              min_lat_margin: 0.5
              max_lat_margin: 1.0
              min_ego_velocity: 0.6
              max_ego_velocity: 2.78
            static:
              min_lat_margin: 0.5
              max_lat_margin: 1.0
              min_ego_velocity: 0.6
              max_ego_velocity: 4.17
          bicycle:  # [nero 2026-11-24 sidegap] as pedestrian
            moving:
              min_lat_margin: 0.5
              max_lat_margin: 1.0
              min_ego_velocity: 0.6
              max_ego_velocity: 2.78
            static:
              min_lat_margin: 0.5
              max_lat_margin: 1.0
              min_ego_velocity: 0.6
              max_ego_velocity: 4.17

        moving_object_speed_threshold: 0.5 # [m/s] how fast the object needs to move to be considered as "moving"
        moving_object_hysteresis_range: 0.1 # [m/s] hysteresis range used to prevent chattering when obstacle moves close to moving_object_speed_threshold

      obstacle_filtering:
        object_type:
          unknown: false
          car: true
          truck: true
          bus: true
          trailer: true
          motorcycle: true
          bicycle: true
          pedestrian: true
          pointcloud: false

        pointcloud:
          pointcloud_voxel_grid_x: 0.05
          pointcloud_voxel_grid_y: 0.05
          pointcloud_voxel_grid_z: 100000.0
          pointcloud_cluster_tolerance: 1.0
          pointcloud_min_cluster_size: 1
          pointcloud_max_cluster_size: 100000

        min_lat_margin: 0.0  # lateral margin between obstacle and trajectory band with ego's width to avoid the conflict with the obstacle_stop
        max_lat_margin: 1.1  # lateral margin between obstacle and trajectory band with ego's width
        lat_hysteresis_margin: 0.2

        successive_num_to_entry_slow_down_condition: 5
        successive_num_to_exit_slow_down_condition: 5
