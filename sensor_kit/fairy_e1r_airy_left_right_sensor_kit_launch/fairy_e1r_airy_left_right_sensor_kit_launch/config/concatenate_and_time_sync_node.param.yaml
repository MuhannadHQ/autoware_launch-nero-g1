/**:
  ros__parameters:
    debug_mode: false
    rosbag_length: 10.0
    maximum_queue_size: 5
    timeout_sec: 0.2
    is_motion_compensated: true
    publish_synchronized_pointcloud: true
    keep_input_frame_in_synchronized_pointcloud: true
    publish_previous_but_late_pointcloud: false
    synchronized_pointcloud_postfix: pointcloud
    input_twist_topic_type: twist
    input_topics: [
                    "/sensing/lidar/top/pointcloud_before_sync",
                    "/sensing/lidar/front/pointcloud_before_sync",
                    "/sensing/lidar/right/pointcloud_before_sync",
                    "/sensing/lidar/left/pointcloud_before_sync",
                ]
    output_frame: base_link
    # [nero 2026-11-11 PHASELOCK] "advanced": group the four scans by header stamp. Valid because every LiDAR is PTP-locked to
    # the host clock (GNSS PPS), the drivers stamp the sensor scan-start time (stamp_mode sensor, nero-drivers-g1 0f4611b) and
    # the spinning LiDARs are phase-locked so that each cloud starts on the PTP 100 ms grid: Phase Lock (web PhaLockSet) and
    # driver cut_angle both at the azimuth pointing to the vehicle rear (docs/LIDAR_PHASE_LOCK.md in nero-drivers-g1).
    # Measured scan start within the cycle, nero-jetson 2026-11-11, 450-900 scans each: Fairy 0.0..+0.5 ms (motor jitter),
    # E1R +0.22 ms (frames on the grid by design), Airy-L 0.0, Airy-R 0.0. Offsets in input_topics order [top=Fairy,
    # front=E1R, right, left]; window 5 ms each (>10x the jitter, far from the 100 ms cycle). Unsynced LiDARs: type naive.
    matching_strategy:
      type: advanced
      lidar_timestamp_offsets: [0.0003, 0.0002, 0.0, 0.0]
      lidar_timestamp_noise_window: [0.005, 0.005, 0.005, 0.005]
